{% extends 'base.html' %}

{% block content %}

<style>
.page-header{
    background:linear-gradient(135deg,#071A3D,#0057FF);
    color:#fff;
    padding:30px;
    border-radius:24px;
    margin-bottom:25px;
}

.card-modern{
    background:#fff;
    border-radius:22px;
    padding:25px;
    box-shadow:0 10px 30px rgba(15,23,42,.08);
}

.choice-card{
    border:2px solid #e5e7eb;
    border-radius:18px;
    padding:20px;
    cursor:pointer;
    transition:.3s;
}

.choice-card:hover{
    border-color:#0057ff;
    background:#f8fbff;
}

.choice-card input{
    transform:scale(1.3);
    margin-right:10px;
}

.form-section{
    display:none;
}

.form-section.active{
    display:block;
}
</style>

<div class="container-fluid">

    <div class="page-header d-flex justify-content-between align-items-center">

        <div>
            <h2 class="fw-bold mb-1">
                <i class="fa-solid fa-door-open"></i>
                Ajouter un logement / une chambre
            </h2>

            <p class="mb-0">
                {{ batiment.nom }}
            </p>
        </div>

        <a href="{% url 'detail_batiment' batiment.id %}"
           class="btn btn-light rounded-4">
            <i class="fa-solid fa-arrow-left"></i>
            Retour
        </a>

    </div>

    <div class="card-modern">

        <form method="POST">

            {% csrf_token %}

            <h5 class="fw-bold mb-4">
                Que souhaitez-vous ajouter ?
            </h5>

            <div class="row g-4 mb-5">

                <div class="col-md-6">

                    <label class="choice-card w-100">

                        <input type="radio"
                               name="type"
                               value="logement"
                               checked>

                        <strong>
                            Nouveau logement
                        </strong>

                        <br>

                        <small class="text-muted">
                            Ajouter un logement complet.
                        </small>

                    </label>

                </div>

                <div class="col-md-6">

                    <label class="choice-card w-100">

                        <input type="radio"
                               name="type"
                               value="chambre">

                        <strong>
                            Chambre dans un logement
                        </strong>

                        <br>

                        <small class="text-muted">
                            Ajouter une chambre dans un logement existant.
                        </small>

                    </label>

                </div>

            </div>


            <!-- Nouveau logement -->

            <div id="blocLogement" class="form-section active">

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label fw-bold">
                            Numéro logement
                        </label>

                        <input type="text"
                               name="numero_logement"
                               class="form-control form-control-lg"
                               value="{{ prochain_numero }}">

                    </div>

                    <div class="col-md-8 mb-3">

                        <label class="form-label fw-bold">
                            Nom logement
                        </label>

                        <input type="text"
                               name="nom_logement"
                               class="form-control form-control-lg"
                               placeholder="Logement {{ prochain_numero }}">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label fw-bold">
                            Nombre de chambres
                        </label>

                        <input type="number"
                               min="1"
                               value="1"
                               name="nombre_chambres"
                               class="form-control form-control-lg">

                    </div>

                </div>

            </div>


            <!-- Chambre -->

            <div id="blocChambre" class="form-section">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Logement
                        </label>

                        <select name="logement"
                                class="form-select form-select-lg">

                            {% for logement in logements %}
                            <option value="{{ logement.id }}">
                                {{ logement.nom }}
                            </option>
                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Numéro chambre
                        </label>

                        <input type="text"
                               name="numero_chambre"
                               class="form-control form-control-lg"
                               placeholder="1">

                    </div>

                </div>

            </div>
<div class="row mt-4">

    <div class="col-md-4 mb-3">
        <label class="form-label fw-bold">Locataire occupant</label>
        <select name="locataire_id" class="form-select form-select-lg">
            <option value="">-- Aucun locataire maintenant --</option>

            {% for locataire in locataires %}
            <option value="{{ locataire.id }}">
                {{ locataire.nom }} {{ locataire.prenom }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="col-md-4 mb-3">
        <label class="form-label fw-bold">Loyer</label>
        <input type="number"
               step="0.01"
               name="loyer"
               class="form-control form-control-lg"
               placeholder="Ex: 500">
    </div>

    <div class="col-md-4 mb-3">
        <label class="form-label fw-bold">Caution</label>
        <input type="number"
               step="0.01"
               name="caution"
               class="form-control form-control-lg"
               placeholder="Ex: 500">
    </div>

</div>
            <hr>

            <div class="text-end">

                <button class="btn btn-primary btn-lg rounded-4">

                    <i class="fa-solid fa-plus"></i>

                    Ajouter

                </button>

            </div>

        </form>

    </div>

</div>

<script>

const radios=document.querySelectorAll("input[name=type]");

const logement=document.getElementById("blocLogement");

const chambre=document.getElementById("blocChambre");

radios.forEach(r=>{

    r.addEventListener("change",()=>{

        if(r.value==="logement" && r.checked){

            logement.classList.add("active");
            chambre.classList.remove("active");

        }

        if(r.value==="chambre" && r.checked){

            chambre.classList.add("active");
            logement.classList.remove("active");

        }

    });

});

</script>

{% endblock %}
