
{% extends 'base.html' %}

{% block content %}

<style>

.employee-hero{
    background:linear-gradient(135deg,#071a3d,#0057ff);
    color:white;
    border-radius:28px;
    padding:30px;
    margin-bottom:25px;
    box-shadow:0 20px 50px rgba(0,87,255,.20);
}

.employee-card{
    background:white;
    border-radius:28px;
    padding:30px;
    box-shadow:0 15px 40px rgba(0,0,0,.06);
    border:1px solid #eef2ff;
}

.section-title{
    font-size:18px;
    font-weight:700;
    color:#071a3d;
    margin-bottom:20px;
}

.form-label{
    font-weight:700;
    color:#071a3d;
}

.form-control,
.form-select{
    height:55px;
    border-radius:16px;
    border:1px solid #dbe4ff;
}

.form-control:focus,
.form-select:focus{
    border-color:#0057ff;
    box-shadow:0 0 0 .2rem rgba(0,87,255,.15);
}

textarea.form-control{
    height:auto;
}

.icon-box{
    width:65px;
    height:65px;
    border-radius:20px;
    background:rgba(255,255,255,.15);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
}

.btn-save{
    background:#0057ff;
    color:white;
    border:none;
    padding:14px 35px;
    border-radius:16px;
    font-weight:700;
}

.btn-save:hover{
    background:#0044cc;
    color:white;
}

</style>

<div class="container-fluid">

    <div class="employee-hero">

        <div class="d-flex justify-content-between align-items-center flex-wrap">

            <div class="d-flex align-items-center gap-3">

                <div class="icon-box">
                    <i class="fa-solid fa-user-plus"></i>
                </div>

                <div>
                    <h2 class="fw-bold mb-1">
                        Ajouter un employé
                    </h2>

                    <p class="mb-0 opacity-75">
                        Créer un compte Agent ou Secrétaire
                    </p>
                </div>

            </div>

            <a href="{% url 'employes' %}"
               class="btn btn-light rounded-4">

                <i class="fa-solid fa-arrow-left"></i>
                Retour

            </a>

        </div>

    </div>

    <div class="employee-card">

        <form method="POST">

            {% csrf_token %}

            <h5 class="section-title">
                <i class="fa-solid fa-user"></i>
                Informations personnelles
            </h5>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Nom
                    </label>

                    <input type="text"
                           name="nom"
                           class="form-control"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Prénom
                    </label>

                    <input type="text"
                           name="prenom"
                           class="form-control"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Téléphone
                    </label>

                    <input type="text"
                           name="telephone"
                           class="form-control"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Nationalité
                    </label>

                    <input type="text"
                           name="nationalite"
                           class="form-control"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Ville
                    </label>

                    <input type="text"
                           name="ville"
                           class="form-control"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Adresse
                    </label>

                    <input type="text"
                           name="adresse"
                           class="form-control"
                           required>

                </div>

            </div>

            <hr class="my-4">

            <h5 class="section-title">
                <i class="fa-solid fa-briefcase"></i>
                Informations professionnelles
            </h5>

            <div class="row">

                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Type employé
                    </label>

                    <select name="type_employe"
                            class="form-select">

                        <option value="agent">
                            Agent immobilier
                        </option>

                        <option value="secretaire">
                            Secrétaire
                        </option>

                    </select>

                </div>

                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Numéro de poste
                    </label>

                    <input type="text"
                           name="numero_poste"
                           class="form-control">

                </div>

                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Salaire
                    </label>

                    <input type="number"
                           step="0.01"
                           name="salaire"
                           class="form-control">

                </div>

                <div class="col-md-12 mb-3">

                    <label class="form-label">
                        Acte de naissance
                    </label>

                    <input type="text"
                           name="acte_naissance"
                           class="form-control"
                           placeholder="Référence ou numéro du document">

                </div>

            </div>

            <hr class="my-4">

            <h5 class="section-title">
                <i class="fa-solid fa-lock"></i>
                Compte de connexion
            </h5>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Nom d'utilisateur
                    </label>

                    <input type="text"
                           name="username"
                           class="form-control"
                           required>

                </div>

             
<div class="col-md-6 mb-3">

    <label class="form-label">
        Mot de passe
    </label>

    <div class="input-group">

        <input type="password"
               id="password"
               name="password"
               class="form-control"
               required>

        <button type="button"
                class="btn btn-outline-secondary"
                onclick="togglePassword()">

            <i id="eyeIcon"
               class="fa-solid fa-eye"></i>

        </button>

    </div>

</div>

<script>

function togglePassword(){

    let password =
        document.getElementById("password");

    let eyeIcon =
        document.getElementById("eyeIcon");

    if(password.type === "password"){

        password.type = "text";

        eyeIcon.classList.remove(
            "fa-eye"
        );

        eyeIcon.classList.add(
            "fa-eye-slash"
        );

    }else{

        password.type = "password";

        eyeIcon.classList.remove(
            "fa-eye-slash"
        );

        eyeIcon.classList.add(
            "fa-eye"
        );

    }

}

</script>



            </div>

            <div class="text-end mt-4">

                <button type="submit"
                        class="btn-save">

                    <i class="fa-solid fa-floppy-disk"></i>
                    Créer le compte

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
