```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modifier Paiement</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:linear-gradient(135deg,#eef4ff,#f8fafc);
    font-family:Arial,sans-serif;
    min-height:100vh;
    padding:30px;
}

.wrapper{
    max-width:1100px;
    margin:auto;
}

.card{
    background:white;
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 22px 60px rgba(15,23,42,.13);
}

.header{
    background:linear-gradient(135deg,#071a3d,#0057ff);
    color:white;
    padding:34px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h2{
    font-size:30px;
    font-weight:900;
    margin-bottom:8px;
}

.header p{
    opacity:.85;
}

.header-icon{
    width:75px;
    height:75px;
    border-radius:22px;
    background:rgba(255,255,255,.15);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
}

.content{
    padding:35px;
}

/* INFO */
.info-box{
    background:#f8fbff;
    border:1px solid #e2e8f0;
    border-radius:22px;
    padding:22px;
    margin-bottom:30px;
}

.info-title{
    font-size:18px;
    font-weight:900;
    color:#071a3d;
    margin-bottom:18px;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.info-item{
    background:white;
    border:1px solid #e5ecf6;
    border-radius:16px;
    padding:16px;
}

.info-item small{
    color:#64748b;
    font-weight:800;
}

.info-item h4{
    margin-top:8px;
    color:#071a3d;
}

/* FORM */
.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.form-group{
    margin-bottom:18px;
}

.form-group.full{
    grid-column:1 / -1;
}

label{
    display:block;
    margin-bottom:8px;
    color:#071a3d;
    font-weight:900;
}

input,
select,
textarea{
    width:100%;
    padding:15px;
    border:1px solid #dbe3f1;
    border-radius:14px;
    outline:none;
    font-size:15px;
    transition:.3s;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#0057ff;
    box-shadow:0 0 0 4px rgba(0,87,255,.08);
}

textarea{
    min-height:120px;
    resize:vertical;
}

/* BUTTONS */
.btns{
    display:flex;
    gap:15px;
    margin-top:25px;
}

.btn-save{
    flex:1;
    border:none;
    background:#16a34a;
    color:white;
    padding:16px;
    border-radius:16px;
    font-weight:900;
    cursor:pointer;
    font-size:15px;
}

.btn-save:hover{
    background:#15803d;
}

.btn-cancel{
    flex:1;
    text-decoration:none;
    text-align:center;
    background:#f1f5f9;
    color:#071a3d;
    padding:16px;
    border-radius:16px;
    font-weight:900;
}

@media(max-width:768px){

    .header{
        flex-direction:column;
        align-items:flex-start;
        gap:20px;
    }

    .form-grid,
    .info-grid{
        grid-template-columns:1fr;
    }

    .btns{
        flex-direction:column;
    }
}

</style>
</head>

<body>

<div class="wrapper">

<div class="card">

    <div class="header">

        <div>
            <h2>
                <i class="fa-solid fa-pen-to-square"></i>
                Modifier le paiement
            </h2>

            <p>
                Modifier toutes les informations du paiement enregistré.
            </p>
        </div>

        <div class="header-icon">
            <i class="fa-solid fa-receipt"></i>
        </div>

    </div>

    <div class="content">

        <!-- Infos actuelles -->
        <div class="info-box">

            <div class="info-title">
                <i class="fa-solid fa-circle-info"></i>
                Informations actuelles
            </div>

            <div class="info-grid">

                <div class="info-item">
                    <small>Locataire</small>
                    <h4>{{ paiement.location.locataire.nom }}</h4>
                </div>

                <div class="info-item">
                    <small>Bâtiment</small>
                    <h4>{{ paiement.location.batiment.nom }}</h4>
                </div>

                <div class="info-item">
                    <small>Montant</small>
                    <h4>{{ paiement.montant }} FCFA</h4>
                </div>

            </div>

        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="form-grid">

                <div class="form-group">
                    <label>Nom du locataire</label>
                    <input type="text"
                           name="locataire_nom"
                           value="{{ paiement.location.locataire.nom }}"
                           required>
                </div>

                <div class="form-group">
                    <label>Nom du bâtiment</label>
                    <input type="text"
                           name="batiment_nom"
                           value="{{ paiement.location.batiment.nom }}"
                           required>
                </div>

                <div class="form-group">
                    <label>Montant</label>
                    <input type="number"
                           step="0.01"
                           name="montant"
                           value="{{ paiement.montant }}"
                           required>
                </div>

                <div class="form-group">
                    <label>Mois concerné</label>
                    <input type="text"
                           name="mois"
                           value="{{ paiement.mois }}"
                           required>
                </div>

                <div class="form-group">
                    <label>Date de paiement</label>
                    <input type="date"
                           name="date_paiement"
                           value="{{ paiement.date_paiement|date:'Y-m-d' }}">
                </div>

                <div class="form-group">
                    <label>Numéro du reçu</label>
                    <input type="text"
                           name="numero_recu"
                           value="{{ paiement.numero_recu|default:'' }}">
                </div>

                <div class="form-group">
                    <label>Mode de paiement</label>

                    <select name="mode_paiement">

                        <option value="especes" {% if paiement.mode_paiement == "especes" %}selected{% endif %}>Espèces</option>

                        <option value="virement" {% if paiement.mode_paiement == "virement" %}selected{% endif %}>Virement</option>

                        <option value="cheque" {% if paiement.mode_paiement == "cheque" %}selected{% endif %}>Chèque</option>

                        <option value="interac" {% if paiement.mode_paiement == "interac" %}selected{% endif %}>Interac</option>

                        <option value="carte" {% if paiement.mode_paiement == "carte" %}selected{% endif %}>Carte bancaire</option>

                    </select>
                </div>

                <div class="form-group">
                    <label>Statut</label>

                    <select name="statut">

                        <option value="paye" {% if paiement.statut == "paye" %}selected{% endif %}>Payé</option>

                        <option value="attente" {% if paiement.statut == "attente" %}selected{% endif %}>En attente</option>

                        <option value="retard" {% if paiement.statut == "retard" %}selected{% endif %}>Retard</option>

                    </select>
                </div>

                <div class="form-group">
                    <label>Agent / Secrétaire</label>
                    <input type="text"
                           name="agent"
                           value="{{ paiement.agent|default:request.user.username }}">
                </div>

                <div class="form-group full">
                    <label>Observation</label>
                    <textarea name="observation">{{ paiement.observation|default:'' }}</textarea>
                </div>

            </div>

            <div class="btns">

                <button type="submit" class="btn-save">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Enregistrer les modifications
                </button>

                <a href="{% url 'paiements' %}" class="btn-cancel">
                    <i class="fa-solid fa-arrow-left"></i>
                    Retour
                </a>

            </div>

        </form>

    </div>

</div>

</div>

</body>
</html>
