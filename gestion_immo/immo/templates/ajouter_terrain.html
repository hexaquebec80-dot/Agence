{% extends "base.html" %}

{% block content %}

<style>
.page{padding:24px;background:#f6f8fc;min-height:100vh}
.form-card{max-width:900px;margin:auto;background:white;border-radius:22px;overflow:hidden;box-shadow:0 18px 50px rgba(15,23,42,.10)}
.header{background:linear-gradient(135deg,#071a3d,#0057ff);color:white;padding:28px}
.header h1{margin:0 0 7px}
.header p{margin:0;opacity:.82}
.body{padding:28px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.group{display:flex;flex-direction:column;gap:7px}
.group.full{grid-column:1/-1}
label{font-weight:800;color:#334155;font-size:13px}
.input{border:1px solid #dbe3ef;border-radius:13px;padding:13px;background:#fbfcff}
textarea.input{min-height:120px}
.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:25px}
.btn-save{border:0;background:#0057ff;color:white;padding:13px 20px;border-radius:13px;font-weight:800}
.btn-cancel{background:#eef2f7;color:#334155;padding:13px 20px;border-radius:13px;text-decoration:none;font-weight:800}
@media(max-width:700px){.page{padding:14px}.grid{grid-template-columns:1fr}.group.full{grid-column:auto}.actions{flex-direction:column-reverse}.btn-save,.btn-cancel{width:100%;text-align:center}}
</style>

<div class="page">

    <div class="form-card">

        <div class="header">
            <h1><i class="fa-solid fa-map-location-dot"></i> Ajouter un terrain</h1>
            <p>Terrain libre, terrain en construction, vente ou achat.</p>
        </div>

        <form method="POST" class="body">
            {% csrf_token %}

            <div class="grid">

                <div class="group">
                    <label>Titre du terrain *</label>
                    <input type="text" name="titre" class="input" required placeholder="Ex : Terrain à vendre Bamako">
                </div>

                <div class="group">
                    <label>Propriétaire</label>
                    <select name="proprietaire" class="input">
                        <option value="">Aucun propriétaire</option>
                        {% for proprietaire in proprietaires %}
                            <option value="{{ proprietaire.id }}">
                                {{ proprietaire.nom }} {{ proprietaire.prenom }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="group">
                    <label>Type opération</label>
                    <select name="type_operation" class="input">
                        {% for value,label in types %}
                            <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="group">
                    <label>Statut terrain</label>
                    <select name="statut" class="input">
                        {% for value,label in statuts %}
                            <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="group">
                    <label>Qualité terrain Mali</label>
                    <select name="qualite" class="input">
                        {% for value,label in qualites %}
                            <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="group">
                    <label>Pays</label>
                    <input type="text" name="pays" class="input" value="Mali">
                </div>

                <div class="group">
                    <label>Ville *</label>
                    <input type="text" name="ville" class="input" required placeholder="Ex : Bamako">
                </div>

                <div class="group">
                    <label>Quartier</label>
                    <input type="text" name="quartier" class="input" placeholder="Ex : Kalaban, Yirimadio...">
                </div>

                <div class="group">
                    <label>Adresse</label>
                    <input type="text" name="adresse" class="input" placeholder="Adresse ou repère">
                </div>

                <div class="group">
                    <label>Superficie m²</label>
                    <input type="number" name="superficie" class="input" step="0.01" min="0" value="0">
                </div>

                <div class="group">
                    <label>Prix terrain</label>
                    <input type="number" name="prix" class="input" step="0.01" min="0" value="0">
                </div>

                <div class="group">
                    <label>Document disponible ?</label>
                    <label style="font-weight:600;">
                        <input type="checkbox" name="document_disponible">
                        Oui, documents disponibles
                    </label>
                </div>

                <div class="group full">
                    <label>Description</label>
                    <textarea name="description" class="input" placeholder="Détails du terrain, accès, documents, qualité, remarques..."></textarea>
                </div>

            </div>

            <div class="actions">
                <a href="{% url 'terrains' %}" class="btn-cancel">Annuler</a>
                <button type="submit" class="btn-save">Enregistrer</button>
            </div>

        </form>

    </div>

</div>

{% endblock %}
