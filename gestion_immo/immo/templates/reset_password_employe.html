{% extends 'base.html' %}

{% block content %}

<style>
.reset-hero{
    background:linear-gradient(135deg,#071a3d,#0057ff);
    color:white;
    border-radius:28px;
    padding:30px;
    margin-bottom:25px;
    box-shadow:0 20px 50px rgba(0,87,255,.22);
}

.reset-card{
    background:white;
    border-radius:28px;
    padding:30px;
    box-shadow:0 15px 45px rgba(15,23,42,.08);
    border:1px solid #e4ecf8;
}

.password-box{
    position:relative;
}

.password-box input{
    height:58px;
    border-radius:18px;
    padding-right:55px;
}

.eye-btn{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:#eef4ff;
    color:#0057ff;
    width:42px;
    height:42px;
    border-radius:14px;
}
</style>

<div class="reset-hero d-flex justify-content-between align-items-center flex-wrap gap-3">
    <div>
        <h2 class="fw-bold mb-1">
            <i class="fa-solid fa-key"></i>
            Réinitialiser le mot de passe
        </h2>
        <p class="mb-0 opacity-75">
            {{ employe.nom }} {{ employe.prenom }} — {{ employe.utilisateur.username }}
        </p>
    </div>

    <a href="{% url 'detail_employe' employe.id %}" class="btn btn-light rounded-4 px-4">
        <i class="fa-solid fa-arrow-left"></i>
        Retour
    </a>
</div>

<div class="reset-card">

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} rounded-4">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label class="form-label fw-bold">
            Nouveau mot de passe
        </label>

        <div class="password-box mb-4">
            <input type="password"
                   id="password"
                   name="password"
                   class="form-control form-control-lg"
                   placeholder="Entrer le nouveau mot de passe"
                   required>

            <button type="button"
                    class="eye-btn"
                    onclick="togglePassword()">
                <i id="eyeIcon" class="fa-solid fa-eye"></i>
            </button>
        </div>

        <button type="submit" class="btn btn-primary btn-lg rounded-4 px-5">
            <i class="fa-solid fa-floppy-disk"></i>
            Enregistrer
        </button>
    </form>

</div>

<script>
function togglePassword(){
    const input = document.getElementById("password");
    const icon = document.getElementById("eyeIcon");

    if(input.type === "password"){
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
    }else{
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
    }
}
</script>

{% endblock %}
